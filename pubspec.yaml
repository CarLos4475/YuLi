name: yuli
description: "YuLi — Segundo Cerebro. Sistema de organización personal offline-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database — Drift ORM + SQLite
  drift: ^2.22.0
  drift_flutter: ^0.2.1

  # State management
  flutter_riverpod: ^2.5.3

  # Markdown + LaTeX rendering
  markdown_widget: ^2.3.2
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.2

  # Image handling
  image_picker: ^1.1.2
  photo_manager: ^3.6.1
  flutter_image_compress: ^2.3.0

  # OCR — handwriting → text (on-device, ML Kit Digital Ink)
  google_mlkit_digital_ink_recognition: ^0.14.2

  # AI assistant (v2) — DeepSeek chat (OpenAI-compatible). API key lives ONLY in
  # secure storage on-device; never in code/git/logs.
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

  # Utilities
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.19.0

  # PDF export
  pdf: ^3.10.8
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpaceGrotesk-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/LOGO_YuLi.png"
  adaptive_icon_background: "#FFFDF8"
  adaptive_icon_foreground: "assets/icon/LOGO_YuLi.png"
  min_sdk_android: 21
